name = "revisio-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Origine autorisée à appeler l'API (GitHub Pages). Pas de slash final.
ALLOWED_ORIGIN = "https://nadir-formadirect.github.io"
# Fournisseur IA (voir src/ai.js). Un seul est implémenté : "gemini".
AI_PROVIDER = "gemini"
# Alias "latest" : évite de figer un modèle retiré. Vérifier avec le bouton « Tester Gemini » de l'espace parent.
GEMINI_MODEL = "gemini-2.5-flash"
# Plafond d'appels IA par jour (UTC) : garde-fou contre toute boucle ou abus.
AI_DAILY_LIMIT = "20"

[[d1_databases]]
binding = "DB"
database_name = "revisio"
# Remplacer par l'identifiant affiché par : npx wrangler d1 create revisio
database_id = "2e653208-972f-40bf-b5a8-2c9039d263bb"

# Secrets (jamais dans ce fichier) — à créer avec `npx wrangler secret put NOM` :
#   GEMINI_API_KEY   clé Gemini
#   PARENT_PASSWORD  mot de passe de l'espace parent (≥ 12 caractères)
#   SESSION_SECRET   chaîne aléatoire ≥ 32 caractères (signe les jetons)
