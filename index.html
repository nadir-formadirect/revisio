border-radius:8px;margin:8px 0;font-size:14px}.warning{background:#fff8e3;border:1px solid #f2dfad;border-radius:11px;padding:12px;font-size:13px;line-height:1.5;color:#735a1b}.footer{font-size:12px;color:#8290a9;text-align:center;margin:18px}.num{font-variant-numeric:tabular-nums}.hidden{display:none!important}

</style></head><body><main class="wrap" id="app"></main><script>
const COURSES=[];
const app=document.getElementById('app');const S={profile:'Enfant 1',course:'anglais',mode:'evaluation',screen:'home',index:0,answers:{},verified:{},grades:{},order:null,remediationQuestions:[],remediationTopics:[]};

const LOCAL_KEY='revisio-v3-local-chapters';
let publishedIds=new Set();
function validChapter(c){
 if(!c||typeof c.id!=='string'||!/^[a-z0-9-]{3,80}$/.test(c.id))throw Error('Identifiant incorrect');
 if(!['name','subject','level'].every(k=>typeof c[k]==='string'&&c[k].trim()))throw Error('Matière, titre ou niveau manquant');
 if(!Array.isArray(c.questions)||c.questions.length<5||c.questions.length>60)throw Error('Nombre de questions incorrect');
 const kinds=['single','multi','text','manual','pair','factor'];const ids=new Set();let score=0;
 for(const q of c.questions){
  if(!Number.isInteger(q.id)||ids.has(q.id)||!kinds.includes(q.type)||typeof q.prompt!=='string'||!q.prompt.trim()||typeof q.topic!=='string'||!q.topic.trim()||typeof q.explanation!=='string'||!q.explanation.trim()||!Number.isFinite(q.weight)||q.weight<=0)throw Error('Question incorrecte');
  ids.add(q.id);score+=q.weight;
  if(['single','multi'].includes(q.type)&&(!Array.isArray(q.options)||q.options.length<2))throw Error('Options manquantes');
  if(q.type==='single'&&!q.options.includes(q.solution))throw Error('Réponse absente des options');
  if(q.type==='multi'&&(!Array.isArray(q.solution)||q.solution.some(x=>!q.options.includes(x))))throw Error('Réponses multiples incorrectes');
  if(q.type==='pair'&&(!Array.isArray(q.solution)||q.solution.length!==2||!Array.isArray(q.labels)||q.labels.length!==2))throw Error('Réponse double incorrecte');
  if(q.type==='factor'&&(typeof q.solution!=='number'||typeof q.displaySolution!=='string'))throw Error('Factorisation incorrecte');
  if(q.type==='text'&&!['number','string'].includes(typeof q.solution))throw Error('Réponse incorrecte');
 }
 if(Math.abs(score-20)>1e-8)throw Error('Le barème doit faire exactement 20 points, trouvé : '+score);
 if(c.evaluationQuestions!==undefined){
  if(!Array.isArray(c.evaluationQuestions)||c.evaluationQuestions.length<5||c.evaluationQuestions.length>60)throw Error('Banque évaluation incorrecte');
  let total=0;const used=new Set();
  for(const q of c.evaluationQuestions){
   if(!Number.isInteger(q.id)||used.has(q.id)||ids.has(q.id)||!kinds.includes(q.type)||typeof q.prompt!=='string'||!q.prompt.trim()||typeof q.topic!=='string'||!q.topic.trim()||typeof q.explanation!=='string'||!q.explanation.trim()||!Number.isFinite(q.weight)||q.weight<=0)throw Error('Question évaluation incorrecte');
   used.add(q.id);total+=q.weight;
   if(['single','multi'].includes(q.type)&&(!Array.isArray(q.options)||q.options.length<2))throw Error('Options évaluation manquantes');
   if(q.type==='single'&&!q.options.includes(q.solution))throw Error('Réponse évaluation absente des options');
   if(q.type==='multi'&&(!Array.isArray(q.solution)||q.solution.some(x=>!q.options.includes(x))))throw Error('Réponses multiples évaluation incorrectes');
   if(q.type==='pair'&&(!Array.isArray(q.solution)||q.solution.length!==2||!Array.isArray(q.labels)||q.labels.length!==2))throw Error('Paire évaluation incorrecte');
   if(q.type==='factor'&&(typeof q.solution!=='number'||typeof q.displaySolution!=='string'))throw Error('Factorisation évaluation incorrecte');
   if(q.type==='text'&&!['number','string'].includes(typeof q.solution))throw Error('Réponse texte évaluation incorrecte');
  }
  if(Math.abs(total-20)>1e-8)throw Error('Barème évaluation différent de 20');
 }
 return c;
}
function saveLocals(){localStorage.setItem(LOCAL_KEY,JSON.stringify(COURSES.filter(c=>!publishedIds.has(c.id))))}
function importUI(){
 const fileInput=app.querySelector('#new-course'),msg=app.querySelector('#new-course-status');
 fileInput.onchange=async()=>{
  try{
   const file=fileInput.files?.[0];if(!file)return;
   if(file.size>1000000)throw Error('Fichier trop volumineux');
   const data=JSON.parse(await file.text()),items=Array.isArray(data)?data:(Array.isArray(data.chapitres)?data.chapitres:[data]);
   if(!items.length)throw Error('Aucun chapitre trouvé');
   const names=new Set();
   for(const c of items){validChapter(c);if(names.has(c.id)||COURSES.some(x=>x.id===c.id))throw Error('Chapitre déjà présent : '+c.id);names.add(c.id)}
   COURSES.push(...items);
   try{saveLocals()}catch(err){COURSES.splice(COURSES.length-items.length,items.length);throw Error('Stockage local indisponible')}
   S.course=items[0].id;home();app.querySelector('#new-course-status').textContent='Chapitre ajouté sur cet appareil (pas encore publié sur les autres appareils).';
  }catch(err){msg.textContent='Import impossible : '+err.message}finally{fileInput.value=''}
 };
}
async function boot(){
 app.innerHTML='<div class="body"><section class="panel" style="margin-top:25px">Chargement des cours…</section></div>';
 try{
  const r=await fetch('./chapitres.json',{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const data=await r.json();
  if(!Array.isArray(data.chapitres))throw Error('Catalogue invalide');
  const ids=new Set();
  for(const c of data.chapitres){validChapter(c);if(ids.has(c.id))throw Error('Chapitre en double');ids.add(c.id)}
  COURSES.push(...data.chapitres);publishedIds=ids;
  try{for(const c of JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]')){validChapter(c);if(!ids.has(c.id))COURSES.push(c)}}catch(err){console.warn('Chapitres locaux non chargés',err)}
  if(!COURSES.some(c=>c.id===S.course))S.course=COURSES[0].id;
  home();
 }catch(err){app.innerHTML='<div class="body"><section class="panel"><h2>Bibliothèque indisponible</h2><p>Recharge cette page pour réessayer.</p><p id="load-error"></p></section></div>';app.querySelector('#load-error').textContent=err.message;console.error(err)}
}

const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr').replace(/[’']/g,' ').replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim();
const current=()=>COURSES.find(c=>c.id===S.course);
const qs=()=>{if(S.mode==='remediation')return S.remediationQuestions;const c=current(),bank=S.mode==='evaluation'&&Array.isArray(c.evaluationQuestions)?c.evaluationQuestions:c.questions;return S.mode==='evaluation'&&Array.isArray(S.order)?S.order.map(id=>bank.find(q=>q.id===id)).filter(Boolean):bank};
function shuffledIds(bank){const ids=bank.map(q=>q.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}return ids}
function isPrime(x){if(!Number.isInteger(x)||x<2)return false;for(let n=2;n*n<=x;n++)if(x%n===0)return false;return true}
function factorNumber(s){s=String(s??'').replace(/^\s*\d+\s*=/,'').replace(/\s/g,'').replace(/[×·∙*xX]/g,'*');const supers={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};s=s.replace(/(\d)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,(_,a,b)=>a+'^'+Array.from(b,x=>supers[x]).join(''));if(!/^\d+(\^\d+)?(\*\d+(\^\d+)?)*$/.test(s))return null;let total=1;for(let token of s.split('*')){const [v,p=1]=token.split('^').map(Number);if(!isPrime(v)||p<1||p>14)return null;total*=Math.pow(v,p);if(total>10000000)return null}return total}
function assessment(q,a){if(q.type==='manual'){if(!String(a??'').trim())return {kind:'blank',points:0};const grade=S.grades[q.id];return grade===1?{kind:'correct',points:q.weight}:grade===0?{kind:'wrong',points:0}:{kind:'pending',points:0}}
 if(a===undefined||a===null||a===''||Array.isArray(a)&&!a.some(x=>String(x).trim()))return {kind:'blank',points:0};
 if(q.type==='pair'){let count=q.solution.reduce((s,n,i)=>s+(Number(a[i])===n&&String(a[i]).trim()!==''?1:0),0);return {kind:count===2?'correct':count===1?'partial':'wrong',points:q.weight*count/2}}
 if(q.type==='multi'){let yes=Array.isArray(a)&&a.length===q.solution.length&&q.solution.every(x=>a.includes(x));return {kind:yes?'correct':'wrong',points:yes?q.weight:0}}
 let ok=q.type==='factor'?factorNumber(a)===q.solution:q.type==='text'?(q.accepted||[q.solution]).some(x=>norm(x)===norm(a)):norm(a)===norm(q.solution);return{kind:ok?'correct':'wrong',points:ok?q.weight:0}}
function summary(){let got=0,pending=0,numCorrect=0,numPending=0;let topics={};qs().forEach(q=>{const r=assessment(q,S.answers[q.id]);got+=r.points;if(r.kind==='pending'){pending+=q.weight;numPending++}if(r.kind==='correct')numCorrect++;if(!topics[q.topic])topics[q.topic]={max:0,earned:0,pending:0};topics[q.topic].max+=q.weight;topics[q.topic].earned+=r.points;if(r.kind==='pending')topics[q.topic].pending+=q.weight});return {got,pending,numCorrect,numPending,topics}}
function remediationPlan(){
 const wrongTopics=new Map();
 for(const q of qs()){
  const a=assessment(q,S.answers[q.id]);
  if(a.kind==='pending')continue;
  if(a.points<q.weight){
   const t=wrongTopics.get(q.topic)||{missed:0,count:0};
   t.missed+=q.weight-a.points;t.count++;
   wrongTopics.set(q.topic,t);
  }
 }
 const ranked=[...wrongTopics].sort((a,b)=>b[1].missed-a[1].missed).map(([topic])=>topic);
 const questions=[],perTopic=new Map();
 for(const topic of ranked){
  const available=current().questions.filter(q=>q.topic===topic);
  const chosen=available.slice(0,Math.min(3,available.length));
  perTopic.set(topic,chosen);
 }
 for(let i=0;i<3;i++)for(const topic of ranked){
  const q=perTopic.get(topic)?.[i];
  if(q&&questions.length<12)questions.push(q);
 }
 return {topics:ranked,questions};
}
function startRemediation(plan){
 if(!plan.questions.length)return;
 S.remediationTopics=plan.topics;
 S.remediationQuestions=plan.questions;
 S.mode='remediation';S.order=null;S.index=0;S.answers={};S.grades={};S.verified={};S.screen='quiz';
 quiz();
}
function remediationResults(){
 const questions=qs();
 let count=0,pending=0,wrong=[];
 for(const q of questions){const r=assessment(q,S.answers[q.id]);if(r.kind==='correct')count++;else if(r.kind==='pending')pending++;else wrong.push(q)}
 const mastered=questions.length-count-pending===0&&pending===0;
 app.innerHTML='<div class="appbar"><button class="session-home" id="result-home" type="button">⌂ Accueil</button><span class="pill">Révision ciblée</span></div><div class="body"><section class="panel" style="margin-top:8px"><div class="label">Bilan de remédiation</div><h1 class="title">'+(mastered?'Progrès confirmés !':'Encore quelques points à travailler')+'</h1><div class="rem-score">'+count+' / '+questions.length+'</div><p class="muted">Exercices entièrement réussis'+(pending?' · '+pending+' réponse(s) à vérifier par un parent':'')+'. Ce résultat n’est pas une note sur 20.</p><div class="line"></div><h2 class="title">Notions travaillées</h2><p class="muted">'+S.remediationTopics.map(esc).join(' · ')+'</p>'+(wrong.length?'<h2 class="title">À revoir</h2>'+wrong.map(q=>'<div class="priority"><strong>'+esc(q.topic)+'</strong><p>'+esc(q.explanation)+'</p></div>').join(''):'<p class="note">Toutes les réponses corrigées ont été réussies. Un nouveau contrôle permettra de confirmer les acquis.</p>')+(pending?'<div class="warning">Les justifications libres doivent être validées par un parent. Ce bilan ne les compte pas comme fausses.</div>':'')+'<div class="actions"><button class="btn" id="rem-repeat" type="button">Refaire ces exercices</button><button class="btn secondary" id="rem-eval" type="button">Refaire un contrôle</button><button class="btn outline" id="rem-home" type="button">Accueil</button></div></section></div>';
 app.querySelector('#result-home').onclick=home;
 app.querySelector('#rem-home').onclick=home;
 app.querySelector('#rem-repeat').onclick=()=>{S.index=0;S.answers={};S.verified={};S.grades={};quiz()};
 app.querySelector('#rem-eval').onclick=()=>{S.mode='evaluation';S.index=0;S.answers={};S.verified={};S.grades={};S.order=shuffledIds(current().evaluationQuestions||current().questions);quiz()};
}
function displaySolution(q){if(q.type==='pair')return q.labels.map((x,i)=>x+' : '+q.solution[i]).join(' ; ');if(q.type==='manual')return q.example||q.explanation;if(q.type==='factor')return q.displaySolution;if(Array.isArray(q.solution))return q.solution.join(' · ');return String(q.solution)}
function displayAnswer(q,a){if(a===undefined||a===null||a===''||Array.isArray(a)&&!a.some(x=>String(x).trim()))return 'Non répondu';return Array.isArray(a)?a.join(' ; '):String(a)}

const NAV_KEY='revisio-navigation-v1';
let nav={subject:null,search:'',view:'dashboard'};
function navHistory(){
 try{const h=JSON.parse(localStorage.getItem(NAV_KEY)||'{}');return h&&typeof h==='object'?h:{}}catch{return {}}
}
function saveNav(id){
 try{const h=navHistory();h[S.profile]={...(h[S.profile]||{}),last:id};localStorage.setItem(NAV_KEY,JSON.stringify(h))}catch(e){}
}
function saveResult(){
 try{const h=navHistory(),p=h[S.profile]||{};h[S.profile]={...p,last:S.course,result:{course:S.course,score:summary().got,pending:summary().pending,time:Date.now()}};localStorage.setItem(NAV_KEY,JSON.stringify(h))}catch(e){}
}
function subjectTitle(name){return name==='Anglais LV1'?'Anglais':name}
function subjectStyle(name){if(name==='Mathématiques')return ['∑','#ece9ff'];if(name==='Espagnol')return ['¡Hola!','#ffecdb'];if(name==='Anglais LV1')return ['EN','#e5f2ff'];if(name==='Technologie')return ['⌘','#e5f6ee'];return ['✦','#eff0fa']}
function lessonCard(c){
 return '<button class="lesson-card" type="button" data-lesson="'+esc(c.id)+'"><span class="lesson-main"><strong>'+esc(c.name)+'</strong><small>'+esc(subjectTitle(c.subject))+' · '+esc(c.level)+' · '+c.questions.length+' questions</small></span><span class="lesson-arrow">›</span></button>'
}
function parentSection(){
 return '<details class="parent-tools"><summary>⚙ Espace parent · Importer un chapitre</summary><div class="parent-inside"><p class="muted">Ajoute un chapitre JSON préparé pour Révisio. Cet import reste seulement sur cet appareil. Pour le rendre disponible à toute la famille, il faut publier le chapitre dans le catalogue GitHub.</p><label class="formlabel" for="new-course">Choisir un fichier de chapitre</label><input id="new-course" class="control" type="file" accept=".json,application/json"><p id="new-course-status" class="muted" aria-live="polite"></p></div></details>'
}
function home(){
 nav.view='dashboard';
 const prev=navHistory()[S.profile]||{};
 const last=COURSES.find(c=>c.id===prev.last);
 const subjectNames=[...new Set(COURSES.map(c=>c.subject))];
 const matches=COURSES.filter(c=>(!nav.subject||c.subject===nav.subject)&&(!nav.search||[c.name,c.subject,c.level,...c.questions.slice(0,4).map(q=>q.topic)].join(' ').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(nav.search.toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,''))));
 app.innerHTML='<header class="top dash-top"><div class="logo">✦ révisio</div><h1>Prêt à réviser ?</h1><p>Retrouve tes cours et progresse à ton rythme.</p></header>'+
 '<div class="body dash-body"><section class="panel dash-panel">'+
 '<div class="dash-profile"><label class="formlabel" for="profile" style="margin:0">Mon espace</label><select class="control profile-select" id="profile"><option>Enfant 1</option><option>Enfant 2</option><option>Enfant 3</option></select></div>'+
 (last?'<div class="resume"><span class="resume-kicker">↗ MA DERNIÈRE LEÇON</span><strong>'+esc(last.name)+'</strong><span>'+esc(subjectTitle(last.subject))+' · '+esc(last.level)+'</span><button class="btn" type="button" id="resume-btn">Ouvrir la leçon →</button></div>':'<div class="welcome-block"><strong>Bienvenue sur Révisio !</strong><span>Choisis une matière pour commencer ta première séance.</span></div>')+
 '<div class="section-heading"><h2>Mes matières</h2><span>'+subjectNames.length+' matières</span></div>'+
 '<div class="subject-grid">'+subjectNames.map(m=>{const style=subjectStyle(m),count=COURSES.filter(c=>c.subject===m).length;return '<button type="button" class="subject-card '+(nav.subject===m?'selected':'')+'" data-subject="'+esc(m)+'" aria-pressed="'+(nav.subject===m?'true':'false')+'"><span class="subject-symbol" style="background:'+style[1]+'">'+esc(style[0])+'</span><strong>'+esc(subjectTitle(m))+'</strong><small>'+count+' chapitre'+(count>1?'s':'')+'</small></button>'}).join('')+'</div>'+
 '<div class="section-heading"><h2>'+ (nav.subject?esc(subjectTitle(nav.subject)):'Bibliothèque des cours')+'</h2><button class="small-link" id="all-lessons" type="button">'+(nav.subject?'Toutes les matières':'Tout voir')+'</button></div>'+
 '<label class="search-wrap" for="search-lesson"><span aria-hidden="true">⌕</span><input id="search-lesson" type="search" autocomplete="off" placeholder="Rechercher une leçon…" value="'+esc(nav.search)+'"></label>'+
 '<p class="muted dash-count" id="lesson-count">'+matches.length+' chapitre'+(matches.length>1?'s':'')+'</p><div id="lessons" class="lesson-list">'+(matches.length?matches.map(lessonCard).join(''):'<div class="no-lessons">Aucun chapitre trouvé. Essaie un autre mot.</div>')+'</div>'+
 parentSection()+'</section></div><div class="footer">Révisio · 5e · Sans abonnement ni API</div>';
 app.querySelector('#profile').value=S.profile;
 app.querySelector('#profile').onchange=e=>{S.profile=e.target.value;nav.subject=null;nav.search='';home()};
 app.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{nav.subject=nav.subject===b.dataset.subject?null:b.dataset.subject;nav.search='';home()});
 app.querySelector('#all-lessons').onclick=()=>{nav.subject=null;nav.search='';home()};
 const search=app.querySelector('#search-lesson');
 search.oninput=e=>{
  nav.search=e.target.value;
  const term=nav.search.toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const found=COURSES.filter(c=>(!nav.subject||c.subject===nav.subject)&&(!term||[c.name,c.subject,c.level,...c.questions.slice(0,4).map(q=>q.topic)].join(' ').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(term)));
  app.querySelector('#lessons').innerHTML=found.length?found.map(lessonCard).join(''):'<div class="no-lessons">Aucun chapitre trouvé. Essaie un autre mot.</div>';
  app.querySelector('#lesson-count').textContent=found.length+' chapitre'+(found.length>1?'s':'');
  bindLessons();
 };
 function bindLessons(){app.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson))}
 bindLessons();
 if(last)app.querySelector('#resume-btn').onclick=()=>openLesson(last.id);
 importUI();
}
function openLesson(id){
 if(!COURSES.some(c=>c.id===id))return home();
 S.course=id;nav.view='setup';
 const c=current(),pts=c.questions.reduce((a,q)=>a+q.weight,0);
 app.innerHTML='<div class="appbar"><button class="back-link" id="back-library" type="button">← Bibliothèque</button><span class="pill">'+esc(c.level)+'</span></div><div class="body"><section class="panel setup-panel"><div class="label">'+esc(subjectTitle(c.subject))+'</div><h1 class="title">'+esc(c.name)+'</h1><div class="note">'+(S.mode==='evaluation'&&c.evaluationQuestions?c.evaluationQuestions.length:c.questions.length)+' questions · '+pts+' points · '+esc(c.level)+(S.mode==='evaluation'?' · Sujet inédit, ordre varié':' · Correction immédiate')+'</div><h2 class="setup-heading">Comment veux-tu travailler ?</h2><div class="grid"><button class="mode '+(S.mode==='training'?'active':'')+'" data-mode="training" type="button"><strong>📘 Entraînement</strong><small>Apprendre avec les corrections immédiates.</small></button><button class="mode '+(S.mode==='evaluation'?'active':'')+'" data-mode="evaluation" type="button"><strong>📝 Évaluation</strong><small>Autres questions, ordre varié, sans aide.</small></button></div><div class="actions"><button class="btn" id="start-lesson" type="button">Commencer →</button></div></section></div>';
 app.querySelector('#back-library').onclick=home;
 app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;openLesson(id)});
 app.querySelector('#start-lesson').onclick=()=>{saveNav(S.course);S.index=0;S.answers={};S.grades={};S.verified={};S.order=S.mode==='evaluation'?shuffledIds(c.evaluationQuestions||c.questions):null;S.screen='quiz';quiz()};
}
function info(){}
function input(q){let a=S.answers[q.id];if(q.type==='single'||q.type==='multi')return (q.options||[]).map(o=>`<label class="answeroption"><input name="option" type="${q.type==='multi'?'checkbox':'radio'}" value="${esc(o)}" ${q.type==='multi'?Array.isArray(a)&&a.includes(o)?'checked':'':a===o?'checked':''}><span>${esc(o)}</span></label>`).join('');if(q.type==='pair')return q.labels.map((label,i)=>`<label class="formlabel" for="p${i}">${esc(label)}</label><input id="p${i}" inputmode="numeric" class="control" value="${esc(Array.isArray(a)?a[i]:'')}" placeholder="Nombre entier">`).join('');if(q.type==='manual')return `<label class="formlabel" for="free">Ta justification</label><textarea class="control" id="free" rows="4" placeholder="Explique avec tes mots…">${esc(a||'')}</textarea>`;return `<label class="formlabel" for="answer">Ta réponse</label><input class="control" id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a||'')}" placeholder="Écris ici ta réponse">${q.type==='factor'?'<p class="muted">Utilise × ou * pour multiplier, et ^ pour les puissances. Ex. : 2^2 × 3.</p>':''}`}
function read(){const q=qs()[S.index];if(q.type==='single')S.answers[q.id]=app.querySelector('[name="option"]:checked')?.value||'';else if(q.type==='multi')S.answers[q.id]=[...app.querySelectorAll('[name="option"]:checked')].map(x=>x.value);else if(q.type==='pair')S.answers[q.id]=q.labels.map((_,i)=>app.querySelector('#p'+i).value.trim());else if(q.type==='manual'){const a=app.querySelector('#free').value.trim();if(a!==S.answers[q.id])delete S.grades[q.id];S.answers[q.id]=a}else S.answers[q.id]=app.querySelector('#answer').value.trim()}
function quiz(){const c=current(),q=qs()[S.index],status=assessment(q,S.answers[q.id]),checked=S.verified[q.id];app.innerHTML=`<div class="appbar"><button class="session-home" id="quiz-home" type="button" aria-label="Revenir à l’accueil">⌂ <span>Accueil</span></button><span class="pill">${S.mode==='training'?'Entraînement':S.mode==='remediation'?'Révision ciblée':'Évaluation'}</span></div><div class="quiz"><div class="muted">${esc(c.subject)} · ${esc(c.name)}</div><div style="display:flex;justify-content:space-between;margin-top:12px"><span class="label">Question ${S.index+1} / ${qs().length}</span><span class="pill">${q.weight} pt${q.weight>1?'s':''}</span></div><div class="progress"><span style="width:${100*(S.index+1)/qs().length}%"></span></div><section class="panel" style="margin-top:0"><div class="label">${esc(q.topic)}</div><h2 class="q">${esc(q.prompt)}</h2><div id="inputs">${input(q)}</div>${S.mode!=='evaluation'&&checked?`<div class="explain ${status.kind==='correct'?'':status.kind==='pending'?'pending':'wrong'}"><strong>${status.kind==='correct'?'✓ Bravo !':status.kind==='pending'?'À vérifier avec le parent':'À retravailler'}</strong><p>Réponse attendue : ${esc(displaySolution(q))}</p><p>${esc(q.explanation)}</p></div>`:''}<div class="actions"><button class="btn outline" id="prev" ${S.index===0?'disabled':''}>← Précédent</button><button class="btn" id="next">${S.mode!=='evaluation'&&!checked?'Vérifier':S.index===qs().length-1?'Voir le bilan →':'Suivant →'}</button></div><p class="muted">${S.mode==='evaluation'?'Pas d’indice pendant le contrôle. Tu peux revenir en arrière avant la fin.':'La correction est affichée après validation.'}</p></section></div>`;
 app.querySelector('#quiz-home').onclick=()=>{if(window.confirm('Quitter cette séance et revenir à l’accueil ? Les réponses de cette séance ne seront pas enregistrées.')){S.screen='home';home()}};app.querySelector('#prev').onclick=()=>{read();S.index--;quiz()};app.querySelector('#next').onclick=()=>{read();if(S.mode!=='evaluation'&&!S.verified[q.id]){S.verified[q.id]=true;quiz();return}if(S.index===qs().length-1){S.screen='results';if(S.mode==='remediation')remediationResults();else results()}else{S.index++;quiz()}}}
function shareText(){let s=summary(),c=current(),lines=['RÉVISIO — BILAN',S.profile,c.subject+' · '+c.name,'Note : '+s.got+(s.pending?' à '+(s.got+s.pending):'')+'/20',s.pending?'Points en attente : '+s.pending:'','Compétences :'];for(const [name,x] of Object.entries(s.topics))lines.push(name+' : '+x.earned+'/'+x.max+(x.pending?' ('+x.pending+' à vérifier)':''));lines.push('','Questions à retravailler :');qs().forEach(q=>{const r=assessment(q,S.answers[q.id]);if(r.kind!=='correct')lines.push('Q'+q.id+' : '+q.prompt+' — '+q.explanation)});return lines.join('\n')}
function results(){saveResult();const plan=remediationPlan();const c=current(),s=summary(),weak=Object.entries(s.topics).filter(([_,v])=>v.earned+v.pending<v.max).sort((a,b)=>a[1].earned/a[1].max-b[1].earned/b[1].max);const top=qs().reduce((n,q)=>n+q.weight,0);app.innerHTML=`<div class="appbar"><button class="session-home" id="result-home" type="button" aria-label="Revenir à l’accueil">⌂ <span>Accueil</span></button><span class="pill">Bilan pédagogique</span></div><div class="body"><section class="panel" style="margin-top:6px"><div class="label">${esc(S.profile)} · ${esc(c.subject)}</div><h1 class="title">${s.pending?'Bilan provisoire':'Contrôle terminé !'}</h1><div style="font-size:40px;font-weight:850;color:#6554d7" class="num">${s.got}${s.pending?'–'+(s.got+s.pending):''}<small style="color:#8793a9;font-size:23px"> / ${top}</small></div>${s.pending?'<div class="warning">Une réponse rédigée doit être validée par un parent avant la note définitive.</div>':''}<div class="stats" style="margin-top:15px"><div class="stat"><strong>${s.numCorrect}</strong><span>Réponses justes</span></div><div class="stat"><strong>${qs().length-s.numCorrect-s.numPending}</strong><span>À revoir</span></div><div class="stat"><strong>${s.numPending}</strong><span>À vérifier</span></div></div><div class="line"></div><h2 class="title">Acquis par notion</h2>${Object.entries(s.topics).map(([t,v])=>`<div><div style="display:flex;justify-content:space-between;gap:10px;font-size:14px"><strong>${esc(t)}</strong><span>${v.earned}/${v.max}${v.pending?' · '+v.pending+' en attente':''}</span></div><div class="bar"><span style="width:${100*v.earned/v.max}%"></span></div></div>`).join('')}<div class="line"></div><h2 class="title">Priorités de révision</h2>${weak.length?weak.slice(0,3).map(([t])=>`<div class="priority">${esc(t)} : revoir le corrigé, puis refaire deux exercices de cette notion.</div>`).join(''):'<p class="muted">Aucune difficulté confirmée parmi les réponses évaluées. Une nouvelle séance permettra de consolider.</p>'}<div class="line"></div><h2 class="title">Réviser mes erreurs</h2>${plan.questions.length?`<div class="rem-card"><strong>Une séance personnalisée sur ${plan.topics.length} notion${plan.topics.length>1?'s':''}</strong><p>${plan.questions.length} exercices ciblés avec correction immédiate. Sans nouvelle note sur 20.</p><button id="start-remediation" class="btn" type="button">Réviser mes difficultés →</button></div>`:`<div class="note">${s.pending?'Valide les justifications en attente pour affiner le diagnostic.':'Aucune difficulté détectée : tu peux consolider avec un autre contrôle.'}</div>`}<div class="line"></div><h2 class="title">Correction détaillée</h2>${qs().map(q=>{const a=assessment(q,S.answers[q.id]);return `<details class="review" ${a.kind==='pending'?'open':''}><summary>Q${q.id} · ${esc(q.topic)} — ${a.points}/${q.weight} pt${q.weight>1?'s':''}</summary><p><strong>${esc(q.prompt)}</strong></p><p>Réponse : ${esc(displayAnswer(q,S.answers[q.id]))}</p><p><strong>Attendu :</strong> ${esc(displaySolution(q))}</p><p>${esc(q.explanation)}</p>${q.type==='manual'&&String(S.answers[q.id]||'').trim()?`<div class="actions"><button class="btn" data-grade="1" data-id="${q.id}">✓ Accepter</button><button class="btn secondary" data-grade="0" data-id="${q.id}">✕ Refuser</button></div>`:''}</details>`}).join('')}<div class="line"></div><h2 class="title">Envoyer le bilan</h2><div class="actions"><button id="share" class="btn">Partager</button><button id="whatsapp" class="btn secondary">WhatsApp</button><button id="copy" class="btn outline">Copier</button></div><div id="fallback" class="hidden"><textarea id="sharetext" class="control" rows="6" readonly style="margin-top:12px"></textarea><p class="muted" id="fallbacktext"></p></div><div class="actions"><button class="btn secondary" id="restart">Recommencer</button><button class="btn outline" id="home">Accueil</button></div><p class="muted">Sans serveur, les résultats ne se synchronisent pas entre appareils. Partage le bilan avant de quitter.</p></section></div>`;
 app.querySelector('#result-home').onclick=()=>{S.screen='home';home()};if(plan.questions.length)app.querySelector('#start-remediation').onclick=()=>startRemediation(plan);app.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{S.grades[Number(b.dataset.id)]=Number(b.dataset.grade);results()});app.querySelector('#restart').onclick=()=>{S.index=0;S.answers={};S.verified={};S.grades={};S.screen='quiz';quiz()};app.querySelector('#home').onclick=()=>{S.screen='home';home()};function fallback(msg){app.querySelector('#fallback').classList.remove('hidden');app.querySelector('#sharetext').value=shareText();app.querySelector('#fallbacktext').textContent=msg}app.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(shareText());fallback('Bilan copié : colle-le dans WhatsApp.')}catch(_){fallback('Copie manuellement le texte ci-dessus.')}};app.querySelector('#share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Révisio - bilan',text:shareText()});return}catch(e){if(e.name==='AbortError')return}}fallback('Partage natif indisponible : copie le texte.')};app.querySelector('#whatsapp').onclick=()=>{let url='https://wa.me/?text='+encodeURIComponent(shareText());let win=window.open(url,'_blank','noopener,noreferrer');if(!win)fallback('Ouverture bloquée : copie le texte ci-dessus.')}}
boot();window.__revisioTest={COURSES,S,assessment,summary,quiz,results};
</script></body></html>
